spring.application.name=marketcore

# Banco de dados (valores vêm de variáveis de ambiente; veja .env.example)
spring.datasource.url=jdbc:mysql://${MARKETCORE_DB_HOST:localhost}:${MARKETCORE_DB_PORT:3306}/${MARKETCORE_DB_NAME:marketcore_db}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MARKETCORE_DB_USER}
spring.datasource.password=${MARKETCORE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT: o segredo precisa ter no mínimo 32 caracteres
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Administrador inicial (opcional)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Sem Open Session in View: todo acesso ao banco acontece dentro das transações dos services
spring.jpa.open-in-view=false
# Carrega coleções/relacionamentos em lote (evita N+1 ao listar pedidos com itens)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Limite de itens por página
spring.data.web.pageable.max-page-size=100
