spring.datasource.url=jdbc:mysql://mysql-db:3306/marketcore_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MARKETCORE_DB_USER}
spring.datasource.password=${MARKETCORE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect