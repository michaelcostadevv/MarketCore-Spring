services:
  mysql-db:
    image: mysql:8.0
    container_name: marketcore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARKETCORE_DB_NAME}
      MYSQL_USER: ${MARKETCORE_DB_USER}
      MYSQL_PASSWORD: ${MARKETCORE_DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306" # exposto só para a máquina local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 força conexão TCP. Com "localhost" o mysqladmin usa o socket local e
      # aprova o servidor TEMPORÁRIO da inicialização (que não aceita rede), liberando a API cedo demais.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  marketcore-api:
    build: .
    container_name: marketcore-api
    restart: on-failure # segunda camada: se o banco oscilar na subida, tenta de novo
    ports:
      - "8080:8080"
    environment:
      MARKETCORE_DB_HOST: mysql-db
      MARKETCORE_DB_NAME: ${MARKETCORE_DB_NAME}
      MARKETCORE_DB_USER: ${MARKETCORE_DB_USER}
      MARKETCORE_DB_PASSWORD: ${MARKETCORE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql-db:
        condition: service_healthy # só sobe a API quando o MySQL aceitar conexões

volumes:
  mysql_data:
