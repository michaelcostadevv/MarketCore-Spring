services:
  mysql-db:
    image: mysql:8.0
    container_name: marketcore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MARKETCORE_DB_NAME}
      MYSQL_USER: ${MARKETCORE_DB_USER}
      MYSQL_PASSWORD: ${MARKETCORE_DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306" # exposto só para a máquina local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  marketcore-api:
    build: .
    container_name: marketcore-api
    ports:
      - "8080:8080"
    environment:
      MARKETCORE_DB_HOST: mysql-db
      MARKETCORE_DB_NAME: ${MARKETCORE_DB_NAME}
      MARKETCORE_DB_USER: ${MARKETCORE_DB_USER}
      MARKETCORE_DB_PASSWORD: ${MARKETCORE_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mysql-db:
        condition: service_healthy # só sobe a API quando o MySQL aceitar conexões

volumes:
  mysql_data:
