services:
  mysql-db:
    image: mysql:8.0
    container_name: marketcore-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketcore_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  marketcore-api:
    build: .
    container_name: marketcore-api
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db

volumes:
  mysql_data: